Bento:
  # The bento dashboard's palette, carried into all of Home Assistant: slate ink and
  # off-white paper, coral for anything you press, and the same hue per kind of
  # thing that the bento tiles use (honey lights, coral media, blue cooling...).
  # Figtree for text and Bricolage Grotesque for headings, loaded by bento-cards.js.

  # ── Type ───────────────────────────────────────────────────────────────
  ha-font-family-body: "Figtree, system-ui, -apple-system, Roboto, sans-serif"
  ha-font-family-heading: "'Bricolage Grotesque', Figtree, system-ui, sans-serif"
  ha-font-family-longform: "Figtree, system-ui, -apple-system, sans-serif"
  primary-font-family: "Figtree, system-ui, -apple-system, Roboto, sans-serif"
  paper-font-common-base_-_font-family: "Figtree, system-ui, -apple-system, Roboto, sans-serif"

  # ── Shape: the bento's 22px corner everywhere ──────────────────────────
  ha-border-radius-sm: "6px"
  ha-border-radius-md: "12px"
  ha-border-radius-lg: "16px"
  ha-border-radius-xl: "18px"
  ha-border-radius-2xl: "22px"
  ha-border-radius-3xl: "26px"
  ha-border-radius-4xl: "30px"
  ha-border-radius-5xl: "34px"
  ha-border-radius-6xl: "38px"
  wa-border-radius-s: "8px"
  wa-border-radius-m: "14px"
  wa-border-radius-l: "22px"
  wa-panel-border-radius: "22px"
  wa-form-control-border-radius: "14px"
  ha-card-border-radius: "22px"
  ha-card-border-width: "0px"
  ha-dialog-border-radius: "28px"
  ha-tile-border-radius: "18px"
  ha-badge-border-radius: "999px"
  ha-dialog-scrim-backdrop-filter: "blur(6px)"

  # ── Primary scale: coral (buttons, switches, sliders, focus, links) ────
  ha-color-primary-05: "#2b0b05"
  ha-color-primary-10: "#47140a"
  ha-color-primary-20: "#6e1f10"
  ha-color-primary-30: "#a32e17"
  ha-color-primary-40: "#d9431f"
  ha-color-primary-50: "#ff6b4a"
  ha-color-primary-60: "#ff8669"
  ha-color-primary-70: "#ffa38c"
  ha-color-primary-80: "#ffc4b4"
  ha-color-primary-90: "#ffe2d9"
  ha-color-primary-95: "#fff0eb"

  # ── Neutral scale: slate, the same family as the tiles' "off" grey ─────
  ha-color-neutral-05: "#0b0e16"
  ha-color-neutral-10: "#11151f"
  ha-color-neutral-20: "#1a1f2c"
  ha-color-neutral-30: "#2b3244"
  ha-color-neutral-40: "#3d4559"
  ha-color-neutral-50: "#5a6276"
  ha-color-neutral-60: "#7a8194"
  ha-color-neutral-70: "#9aa1b2"
  ha-color-neutral-80: "#c3c8d4"
  ha-color-neutral-90: "#e3e6ee"
  ha-color-neutral-95: "#f2f3f7"

  # ── Status ─────────────────────────────────────────────────────────────
  success-color: "#2fbf8f"
  warning-color: "#ff9a52"
  error-color: "#f04a42"
  info-color: "#5ab8ff"
  label-badge-red: "#f04a42"
  label-badge-blue: "#5ab8ff"
  label-badge-green: "#2fbf8f"
  label-badge-yellow: "#ffc933"

  # ── Device states: the bento's hue for each kind of thing ──────────────
  state-active-color: "#ff6b4a"
  state-light-active-color: "#ffc933"
  state-switch-active-color: "#ff6b4a"
  state-input_boolean-active-color: "#ff6b4a"
  state-fan-active-color: "#3fd0c4"
  state-media_player-active-color: "#ff6b6b"
  state-cover-active-color: "#5ab8ff"
  state-valve-active-color: "#5ab8ff"
  state-vacuum-active-color: "#3fd0c4"
  state-lawn_mower-active-color: "#9fd33a"
  state-siren-active-color: "#f04a42"
  state-update-active-color: "#ff6b4a"
  state-plant-active-color: "#9fd33a"
  state-humidifier-on-color: "#5ab8ff"
  state-binary_sensor-active-color: "#ff9a52"
  state-device_tracker-home-color: "#2fbf8f"
  state-person-home-color: "#2fbf8f"
  state-climate-cool-color: "#5ab8ff"
  state-climate-heat-color: "#ff9a52"
  state-climate-auto-color: "#a78bfa"
  state-climate-heat-cool-color: "#a78bfa"
  state-climate-dry-color: "#9fd33a"
  state-climate-fan_only-color: "#3fd0c4"
  state-lock-locked-color: "#2fbf8f"
  state-lock-unlocked-color: "#f04a42"
  state-lock-open-color: "#f04a42"
  state-lock-jammed-color: "#f04a42"
  state-lock-locking-color: "#ffc933"
  state-lock-unlocking-color: "#ffc933"
  state-sensor-battery-high-color: "#2fbf8f"
  state-sensor-battery-medium-color: "#ffc933"
  state-sensor-battery-low-color: "#f04a42"
  state-sun-above_horizon-color: "#ffc933"
  state-sun-below_horizon-color: "#6a4be0"
  state-alarm_control_panel-armed_home-color: "#2fbf8f"
