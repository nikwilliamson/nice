  state-alarm_control_panel-armed_night-color: "#6a4be0"
  state-alarm_control_panel-triggered-color: "#f04a42"

  # ── Energy dashboard ───────────────────────────────────────────────────
  energy-grid-consumption-color: "#5ab8ff"
  energy-grid-return-color: "#a78bfa"
  energy-solar-color: "#ffc933"
  energy-non-fossil-color: "#9fd33a"
