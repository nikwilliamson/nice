Hearth:
  # Mid-century modern for all of Home Assistant: cream and walnut, chunky round corners,
  # a tangerine / teal / mustard / plum / avocado / cobalt palette, Outfit for text and Fraunces for headings.

  # ── Type ───────────────────────────────────────────────────────────────
  ha-font-family-body: "Outfit, Roboto, Noto, sans-serif"
  ha-font-family-heading: "Fraunces, Outfit, Roboto, Noto, sans-serif"
  ha-font-family-longform: "Outfit, ui-sans-serif, system-ui, sans-serif"
  primary-font-family: "Outfit, Roboto, Noto, sans-serif"
  paper-font-common-base_-_font-family: "Outfit, Roboto, Noto, sans-serif"

  # ── Shape: everything a little rounder ──────────────────────────────────
  ha-border-radius-sm: "6px"
  ha-border-radius-md: "12px"
  ha-border-radius-lg: "16px"
  ha-border-radius-xl: "20px"
  ha-border-radius-2xl: "24px"
  ha-border-radius-3xl: "28px"
  ha-border-radius-4xl: "32px"
  ha-border-radius-5xl: "36px"
  ha-border-radius-6xl: "40px"
  wa-border-radius-s: "8px"
  wa-border-radius-m: "14px"
  wa-border-radius-l: "22px"
  wa-panel-border-radius: "24px"
  wa-form-control-border-radius: "16px"
  ha-card-border-radius: "28px"
  ha-card-border-width: "0px"
  ha-dialog-border-radius: "32px"
  ha-tile-border-radius: "20px"
  ha-badge-border-radius: "999px"
  ha-dialog-scrim-backdrop-filter: "blur(6px)"

  # ── Primary scale: tangerine (buttons, switches, sliders, focus, links) ─
  ha-color-primary-05: "#2a0e02"
  ha-color-primary-10: "#451804"
  ha-color-primary-20: "#6e2607"
  ha-color-primary-30: "#a3390a"
  ha-color-primary-40: "#d94e12"
  ha-color-primary-50: "#ff6b2c"
  ha-color-primary-60: "#ff8650"
  ha-color-primary-70: "#ffa47b"
  ha-color-primary-80: "#ffc6a8"
  ha-color-primary-90: "#ffe3d4"
  ha-color-primary-95: "#fff1e9"

  # ── Neutral scale: warm walnut to cream instead of grey ──────────────────
  ha-color-neutral-05: "#17120e"
  ha-color-neutral-10: "#221a14"
  ha-color-neutral-20: "#33281f"
  ha-color-neutral-30: "#4a3b2f"
  ha-color-neutral-40: "#63513f"
  ha-color-neutral-50: "#7c6652"
  ha-color-neutral-60: "#9a836c"
  ha-color-neutral-70: "#b9a189"
  ha-color-neutral-80: "#d6c3aa"
  ha-color-neutral-90: "#ece0c9"
  ha-color-neutral-95: "#f6eedf"

  # ── Status colours from the palette ─────────────────────────────────────
  success-color: "#2e9c8f"
  warning-color: "#e5832b"
  error-color: "#e8473b"
  info-color: "#3f6fd8"
  label-badge-red: "#e8473b"
  label-badge-blue: "#3f6fd8"
  label-badge-green: "#2e9c8f"
  label-badge-yellow: "#ffb81c"

  # ── Device states on native cards, tiles and badges ─────────────────────
  state-active-color: "#ff6b2c"
  state-light-active-color: "#ffb81c"
  state-switch-active-color: "#ff6b2c"
  state-input_boolean-active-color: "#ff6b2c"
  state-fan-active-color: "#00a19a"
  state-media_player-active-color: "#c2509a"
  state-cover-active-color: "#3f6fd8"
  state-valve-active-color: "#2ec4c6"
  state-vacuum-active-color: "#00a19a"
  state-lawn_mower-active-color: "#9cbf2b"
  state-siren-active-color: "#e8473b"
  state-update-active-color: "#ff6b2c"
  state-plant-active-color: "#9cbf2b"
  state-humidifier-on-color: "#2ec4c6"
  state-binary_sensor-active-color: "#c2509a"
  state-device_tracker-home-color: "#9cbf2b"
  state-person-home-color: "#9cbf2b"
  state-climate-cool-color: "#2ec4c6"
  state-climate-heat-color: "#ff6b2c"
  state-climate-auto-color: "#c2509a"
  state-climate-heat-cool-color: "#c2509a"
