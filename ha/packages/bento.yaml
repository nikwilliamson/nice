template:
# Bento - the data behind the landing-page bento.
#
# The rules live in custom_templates/bento.jinja. This file only gathers what a
# plain template cannot see on its own (to-do items and calendar events need an
# action call) and renders the result into sensor.bento_tiles, which is the one
# entity the bento card reads.
#
# House chores reads both to-do lists. Alerts that a tile already shows are
# filtered out by the same prefix list the tiles use (owned_prefixes), so the
# list and the tiles cannot disagree about what is a chore.
- triggers:
  - trigger: state
    entity_id:
    - todo.house_alerts
    - todo.shopping_list
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: event_template_reloaded
  - trigger: time_pattern
    minutes: /10
      # Backstop. The state trigger only sees the count change, so an item
      # renamed in place would otherwise wait for the next add or remove.
  actions:
  - action: todo.get_items
    target:
      entity_id:
      - todo.house_alerts
      - todo.shopping_list
    data:
      status: needs_action
    response_variable: lists
  - variables:
      chores: >-
        {%- from 'bento.jinja' import is_owned -%}
        {%- set ns = namespace(c=[]) -%}
        {%- for i in lists['todo.house_alerts']['items'] -%}
          {%- if is_owned(i.summary) | trim != 'True' -%}
            {%- set ns.c = ns.c + [{'uid': i.uid, 'summary': i.summary}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.c }}
  sensor:
  - name: House chores
    unique_id: house_chores
    icon: mdi:broom
    state: "{{ chores | count }}"
    attributes:
      chores: "{{ chores }}"
      alerts: "{{ lists['todo.house_alerts']['items'] }}"
      shopping: "{{ lists['todo.shopping_list']['items'] }}"

# Next event on the home calendar within two days. calendar.get_events is the
# only way to see past the event currently in progress, which is all the
# calendar entity itself exposes.
- triggers:
  - trigger: state
    entity_id: calendar.home_calendar
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: event_template_reloaded
  - trigger: time_pattern
    minutes: /5
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.home_calendar
    data:
      duration:
        hours: 48
    response_variable: cal
  - variables:
      nxt: >-
        {%- set ns = namespace(e=none) -%}
        {%- for e in cal['calendar.home_calendar']['events'] | sort(attribute='start') -%}
          {%- set all_day = 'T' not in e.start -%}
          {%- set st = strptime(e.start, '%Y-%m-%d').replace(tzinfo=now().tzinfo) if all_day else as_local(as_datetime(e.start)) -%}
          {%- if ns.e is none and (st > now() or (all_day and st.date() > now().date())) -%}
            {%- set ns.e = {'summary': e.summary, 'start': st.isoformat(), 'all_day': all_day,
                            'minutes_until': ((st - now()).total_seconds() / 60) | int} -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.e }}
  sensor:
  - name: Next event
    unique_id: next_event
    icon: mdi:calendar-clock
    state: "{{ nxt.summary if nxt else 'none' }}"
    attributes:
      start: "{{ nxt.start if nxt else none }}"
      all_day: "{{ nxt.all_day if nxt else false }}"
      minutes_until: "{{ nxt.minutes_until if nxt else none }}"

# The bento itself. State is the house mode, so it only changes when the mode
# does; the tiles live in an attribute. Re-rendered when anything bento.jinja
# reads changes, and once a minute for the clock.
- sensor:
  - name: Bento tiles
    unique_id: bento_tiles
    icon: mdi:view-dashboard-variant
    state: "{{ states('sensor.house_mode') }}"
    attributes:
      tiles: >-
        {%- from 'bento.jinja' import tiles -%}
        {{ tiles() | from_json }}
- triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: event_template_reloaded
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: hourly
    response_variable: fc
  - variables:
      hrs: >-
        {%- set ns = namespace(h=[]) -%}
        {%- for f in fc['weather.forecast_home']['forecast'][:12] -%}
          {%- set t = as_local(as_datetime(f.datetime)) -%}
          {%- set p = f.precipitation | float(0) -%}
          {%- set ns.h = ns.h + [{'t': t.isoformat(), 'h': t.hour, 'in': p | round(2),
              'wet': p >= 0.01 or f.condition in ['rainy', 'pouring', 'lightning-rainy'],
              'sure': p >= 0.01}] -%}
        {%- endfor -%}
        {{ ns.h }}
      run: >-
        {%- set ns = namespace(start=none, stop=none, total=0, sure=false) -%}
        {%- for h in hrs -%}
          {%- if ns.start is none and h.wet -%}{%- set ns.start = h.t -%}{%- endif -%}
          {%- if ns.start is not none and ns.stop is none -%}
            {%- if h.wet -%}{%- set ns.total = ns.total + h['in'] -%}{%- set ns.sure = ns.sure or h.sure -%}
            {%- else -%}{%- set ns.stop = h.t -%}{%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ {'start': ns.start, 'stop': ns.stop, 'inches': ns.total | round(2), 'sure': ns.sure} }}
  sensor:
  - name: Rain outlook
    unique_id: rain_outlook
    icon: mdi:weather-pouring
    state: >-
      {{ ([((as_datetime(run.start) - now()).total_seconds() / 60) | int, 0] | max) if run.start else 'none' }}
    attributes:
      starts: "{{ run.start }}"
      stops: "{{ run.stop }}"
      inches: "{{ run.inches }}"
      sure: "{{ run.sure }}"
      hours: "{{ hrs[:8] }}"
- triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_door
    - binary_sensor.back_door
    - binary_sensor.bedroom_exterior_door
    - binary_sensor.living_room_window_1
    - binary_sensor.living_room_window_2
    - binary_sensor.kitchen_window
    from: 'off'
    to: 'on'
  sensor:
  - name: Last door opened
    unique_id: last_door_opened
    icon: mdi:door-open
    device_class: timestamp
    state: "{{ now().isoformat() }}"
    attributes:
      entity_id: "{{ trigger.entity_id }}"
- triggers:
  - trigger: state
    entity_id: sensor.house_mode
    to: away
  sensor:
  - name: Away since
    unique_id: away_since
    icon: mdi:home-export-outline
    device_class: timestamp
    state: "{{ now().isoformat() }}"
automation:
# Every automation here starts with a condition on its own
# input_boolean.*_enabled, the same pattern as the other packages: a muted
# automation still triggers and still writes a trace.
#
# The board and the bento both read todo.house_alerts. Nothing here writes to
# either directly.
- id: kitchen_dishwasher_done
  alias: Kitchen - Dishwasher done
  description: >-
    Raises UNLOAD THE DISHWASHER. once the dishwasher circuit has been quiet for
    20 minutes after a real cycle.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: numeric_state
    entity_id: sensor.dishwasher_power_minute_average
    below: 5
    for: "00:20:00"
      # Twenty minutes rides through the drying phase, which sits at or near
      # zero between heater pulses. Standby on this circuit is a true zero.
  conditions:
  - condition: state
    entity_id: input_boolean.kitchen_dishwasher_done_alert_enabled
    state: "on"
  - "{{ trigger.from_state.state not in ['unknown', 'unavailable'] }}"
      # Emporia drops to unavailable on reconnect; coming back at 0 W is not
      # the end of a cycle.
  - condition: numeric_state
    entity_id: sensor.dishwasher_energy_today
    above: 0.3
      # A real wash draws about 1 kWh. This keeps a brief blip on the circuit
      # from announcing clean dishes. A cycle that ends just after midnight
      # will be missed, which is the cheaper mistake.
  actions:
  - action: script.house_alert_raise
    data:
      message: UNLOAD THE DISHWASHER.

# RECONCILER. A new run means the last load was unloaded, so clear the alert,
# including the hand-typed version. Not gated: muting a reconciler could only
# leave a stale alert up.
- id: kitchen_dishwasher_alert_reconcile
  alias: Kitchen - Reconcile dishwasher alert
  description: Clears the unload alert when the dishwasher starts its next cycle.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: numeric_state
    entity_id: sensor.dishwasher_power_minute_average
    above: 50
    for: "00:02:00"
  conditions:
  - "{{ trigger.from_state.state not in ['unknown', 'unavailable'] }}"
  actions:
  - action: script.house_alert_clear
    data:
      message: UNLOAD THE DISHWASHER.
  - action: script.house_alert_clear
    data:
      message: UNLOAD DISHWASHER
rest:
- resource: "https://ll.thespacedevs.com/2.3.0/launches/upcoming/?location__ids=12,27&limit=1&mode=list"
  scan_interval: 1800
  sensor:
  - name: Next Florida launch
    unique_id: next_florida_launch
    icon: mdi:rocket-launch
    device_class: timestamp
    value_template: "{{ value_json.results[0].net if value_json.results else none }}"
    json_attributes_path: "$.results[0]"
    json_attributes:
    - name
    - net_precision
    - status
    - window_end
